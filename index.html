<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tín hiệu – Quang Thuận Stocks</title>
<meta name="theme-color" content="#0f2a44">
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#132033;--mut:#62708a;--line:#e3e8ef;--brand:#0f2a44;--ok:#12805c;--okbg:#e3f5ee;--bad:#c23a3a;--badbg:#fbeaea;--warn:#b7791f}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1520;--card:#152131;--ink:#e6edf6;--mut:#93a3ba;--line:#24344a;--brand:#0a1a2b;--okbg:#103a2c;--badbg:#3a1a1c;--ok:#3cc98f;--bad:#ef7373}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  header{background:var(--brand);color:#fff;padding:18px 16px}
  .wrap{max-width:980px;margin:0 auto;padding:0 16px}
  header .wrap{padding:0}
  h1{margin:0;font-size:20px;letter-spacing:.3px}
  .sub{opacity:.75;font-size:13px}
  .banner{margin:18px 0;padding:14px 16px;border-radius:12px;font-weight:600}
  .banner.none{background:var(--badbg);color:var(--bad)}
  .banner.yes{background:var(--okbg);color:var(--ok)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card.dat{border:2px solid var(--ok)}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  .ma{font-size:22px;font-weight:800}
  .tag{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600}
  .tag.ok{background:var(--okbg);color:var(--ok)} .tag.no{background:var(--badbg);color:var(--bad)}
  .nums{display:flex;gap:16px;margin:8px 0 10px;font-size:13px;color:var(--mut)}
  .nums b{display:block;color:var(--ink);font-size:16px}
  ul{list-style:none;margin:0;padding:0;font-size:13px}
  li{padding:3px 0;border-top:1px dashed var(--line)}
  li:first-child{border-top:0}
  .y{color:var(--ok)} .n{color:var(--bad)}
  .bar{height:6px;background:var(--line);border-radius:6px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok)}
  footer{color:var(--mut);font-size:12px;padding:24px 0 32px;text-align:center}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>QUANG THUẬN STOCKS · Máy quét tín hiệu</h1>
  <div class="sub" id="ngay">Đang tải dữ liệu…</div>
</div></header>
<main class="wrap">
  <div id="banner" class="banner none">Đang tải…</div>
  <div id="grid" class="grid"></div>
</main>
<footer class="wrap">Tiêu chí lọc: Trend Template. Thông tin chỉ mang tính tham khảo, không phải khuyến nghị đầu tư.<br>Liên hệ: 0985 605 252</footer>
<script>
fetch('data.json?t=' + Date.now()).then(r => r.json()).then(d => {
  const [y,m,dd] = d.ngay.split('-');
  document.getElementById('ngay').textContent = 'Cập nhật ngày ' + dd + '/' + m + '/' + y;
  const dat = d.ma.filter(x => x.dat);
  const b = document.getElementById('banner');
  if (dat.length) { b.className = 'banner yes'; b.textContent = 'Có tín hiệu: ' + dat.map(x => x.ma).join(', '); }
  else { b.textContent = 'Hôm nay không có tín hiệu mua. Đứng ngoài, chờ cổ phiếu đạt đủ tiêu chí.'; }
  const ds = [...d.ma].sort((a,b) => (b.dat - a.dat) || (a.truot.length - b.truot.length) || (b.rs - a.rs));
  document.getElementById('grid').innerHTML = ds.map(x => {
    const cach = ((x.pivot - x.gia) / x.gia * 100).toFixed(1);
    const nDat = d.tieu_chi.length - x.truot.length;
    const tc = d.tieu_chi.map(t => {
      const ok = !x.truot.includes(t);
      return '<li><span class="' + (ok ? 'y' : 'n') + '">' + (ok ? '✓' : '✗') + '</span> ' + t.replace(/^gia/, 'Giá') + '</li>';
    }).join('');
    return '<div class="card' + (x.dat ? ' dat' : '') + '"><div class="top"><span class="ma">' + x.ma + '</span>' +
      '<span class="tag ' + (x.dat ? 'ok">ĐẠT' : 'no">Chưa đạt') + '</span></div>' +
      '<div class="nums"><span>Giá<b>' + x.gia.toFixed(2) + '</b></span><span>Pivot<b>' + x.pivot.toFixed(2) + '</b></span>' +
      '<span>Cách pivot<b>' + cach + '%</b></span><span>RS<b>' + x.rs + '</b></span></div>' +
      '<ul>' + tc + '</ul><div class="bar"><i style="width:' + (nDat / d.tieu_chi.length * 100) + '%"></i></div>' +
      '<div class="sub" style="font-size:12px;color:var(--mut);margin-top:4px">Đạt ' + nDat + '/' + d.tieu_chi.length + ' tiêu chí</div></div>';
  }).join('');
}).catch(() => {
  document.getElementById('banner').textContent = 'Không tải được dữ liệu (data.json).';
});
</script>
</body>
</html>
